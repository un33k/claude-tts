[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tts"
version = "0.1.0"
description = "Multi-provider Text-to-Speech package for Claude Code integration"
readme = "README.md"
authors = [
    {name = "Claude TTS Contributors"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["tts", "text-to-speech", "claude", "elevenlabs", "openai", "gemini", "pyttsx3"]

dependencies = [
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
pyttsx3 = ["pyttsx3>=2.90"]
elevenlabs = ["elevenlabs>=0.2.0"]
openai = ["openai>=1.0.0"]
gemini = ["google-generativeai>=0.3.0"]
all = [
    "pyttsx3>=2.90",
    "elevenlabs>=0.2.0", 
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/claude-tts"
Issues = "https://github.com/yourusername/claude-tts/issues"

[project.scripts]
claude-tts = "claude_tts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_tts*"]

[tool.setuptools.package-data]
claude_tts = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/claude_tts"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]